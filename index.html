
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 SpendWise</h1>
      <p>Track your money. Control your expenses.</p>
    </header>

    <section class="summary">
      <div class="card">
        <h3>Total Expenses</h3>
        <h2 id="total">₹0.00</h2>
      </div>
      <div class="card">
        <h3>This Month</h3>
        <h2 id="monthly">₹0.00</h2>
      </div>
      <div class="card">
        <h3>Average Expense</h3>
        <h2 id="average">₹0.00</h2>
      </div>
    </section>

    <section class="form-section">
      <h2 id="formTitle">Add Expense</h2>
      <form id="expenseForm">
        <input type="text" id="title"
          placeholder="Expense name" required>

        <input type="number" id="amount"
          placeholder="Amount (₹)" min="0.01"
          step="0.01" required>

        <select id="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Health">Health</option>
          <option value="Education">Education</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>

        <input type="date" id="date" required>

        <textarea id="notes"
          placeholder="Notes (optional)"></textarea>

        <button type="submit" id="submitBtn">
          Add Expense
        </button>
        <button type="button" id="cancelEdit"
          hidden>Cancel</button>
      </form>
    </section>

    <section class="expense-section">
      <h2>Expense History</h2>

      <div class="filters">
        <input type="search" id="search"
          placeholder="Search expenses...">

        <select id="filterCategory">
          <option value="all">All Categories</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Health</option>
          <option>Education</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>

        <input type="date" id="fromDate">
        <input type="date" id="toDate">

        <select id="sort">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="high">Highest Amount</option>
          <option value="low">Lowest Amount</option>
        </select>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expenseList"></tbody>
        </table>
      </div>
      <p id="emptyMessage">No expenses added yet.</p>
      <p id="count"></p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
